[package]
name = "token_list_module"
version = "1.0.0"
edition = "2021"
description = "Logos token_list module — Uniswap token-lists fetch/parse/merge + custom list (proxyable, fail-closed)."
rust-version = "1.89"

[workspace]
resolver = "3"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json", "blocking"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]

[dev-dependencies]
tempfile = "3"
