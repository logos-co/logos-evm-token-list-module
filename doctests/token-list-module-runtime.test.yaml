name: "Running the token-list Module Against logosctl"
output: token-list-module-runtime.md
release: ""

intro: |
  `logos-evm-token-list-module` downloads, parses, and merges
  [Uniswap token-lists](https://github.com/Uniswap/token-lists) plus a user
  "custom" list for the Logos multi-chain EVM wallet, deduped per chain. Downloads
  go through the same fail-closed proxy chokepoint as the eth-rpc module.

  This doc-test drives the module through a `logosctl` daemon against a **local
  static file server** (offline, reproducible): it configures a list URL,
  refreshes, reads the merged tokens, enables a token, pages the picker, and
  finally shows the fail-closed refusal when a proxy is required but unavailable.

what_you_build: "This `token_list_module`, packaged as `.lgx`, installed into a `logosctl` session, and driven through its daemon against a local list server."

what_you_learn:
  - How list URLs are configured and fetched into the module
  - How downloaded lists merge with a user custom list (deduped per chain)
  - How an enabled token becomes a persisted offered-row snapshot
  - How the offered-first picker supports search and pagination
  - How the fail-closed proxy chokepoint refuses a fetch when a proxy is required but unavailable

prerequisites:
  - |
    **Nix** with flakes enabled (see [nixos.org](https://nixos.org/download.html)).
  - "**A Linux or macOS machine** with `python3` available (used to serve the local token list)."

sections:
  - title: "Build logosctl"
    step: true
    steps:
      - title: "Build logosctl"
        run: "nix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos"
        check_file: "logos/bin/logosctl"

  - title: "Build and install the token-list module"
    step: true
    steps:
      - title: "Build the module's .lgx"
        run: "nix build 'github:logos-co/logos-evm-token-list-module{release}#lgx' --no-write-lock-file -o token-list-lgx"
        code_block: |
          nix build 'github:logos-co/logos-evm-token-list-module{release}#lgx' -o token-list-lgx
      - title: "Start the daemon"
        text: |
          The session directory, `./session`, holds the daemon's config, its
          installed modules and their data. `--detach` returns once the daemon
          accepts commands.
        # The bundled package downloader starts a storage node in $HOME; keep it
        # out of the real one.
        run: "mkdir -p home && HOME=\"$PWD/home\" ./logos/bin/logosctl --config-dir ./session daemon start --detach"
        code_block: "logosctl daemon start --detach"
        expect_contains:
          - "Daemon started"
      - title: "Install the .lgx"
        text: |
          A path ending in `.lgx` installs from disk, with no catalog involved. A
          local build is unsigned, which the session's default policy accepts with
          a warning. `-y` confirms, since there is no terminal to ask on.
        run: "./logos/bin/logosctl --config-dir ./session install token-list-lgx/*.lgx -y"
        code_block: "logosctl install token-list-lgx/*.lgx -y"
        expect_contains:
          - '"installed":["token_list_module"]'

  - title: "Serve a token list locally"
    step: true
    steps:
      - title: "Write a Uniswap-schema token list"
        file:
          path: list.json
          content: |
            {
              "name": "Test List",
              "tokens": [
                { "chainId": 1, "address": "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", "name": "USD Coin", "symbol": "USDC", "decimals": 6 },
                { "chainId": 1, "address": "0xdAC17F958D2ee523a2206206994597C13D831ec7", "name": "Tether", "symbol": "USDT", "decimals": 6 },
                { "chainId": 10, "address": "0x4200000000000000000000000000000000000042", "name": "Optimism", "symbol": "OP", "decimals": 18 }
              ]
            }
      - title: "Start a static file server"
        run: "sh -c 'python3 -m http.server 8601 > httpd.log 2>&1 & echo $! > httpd.pid'"
        code_block: "python3 -m http.server 8601 &"
      - run: "sleep 2"

  - title: "Drive the module"
    step: true
    steps:
      - title: "Write the configs"
        file:
          path: tl_config.json
          content: |
            { "listUrls": ["http://127.0.0.1:8601/list.json"], "proxyRequired": false }
      - title: "Write the fail-closed config"
        file:
          path: tl_config_fc.json
          content: |
            { "listUrls": ["http://127.0.0.1:8601/list.json"], "proxyRequired": true }
      - title: "Write a custom token"
        file:
          path: custom_token.json
          content: |
            { "chainId": 1, "address": "0x1111111111111111111111111111111111111111", "name": "Mine", "symbol": "MINE", "decimals": 18 }
      - title: "Load the module"
        run: "./logos/bin/logosctl --config-dir ./session module load token_list_module"
        code_block: "logosctl module load token_list_module"
        expect_contains:
          - "token_list_module"
      - title: "Configure the list URL"
        run: "./logos/bin/logosctl --config-dir ./session call token_list_module configure @tl_config.json"
        code_block: "logosctl call token_list_module configure @tl_config.json"
        expect_contains:
          - "true"
      - title: "Refresh (fetch + parse + merge)"
        # Driving the module through a blocking HTTP fetch can wedge its transport
        # on loaded CI runners (RPC_FAILED that persists within the session). On a
        # transient failure, reset the module with `module reload` + re-configure
        # before retrying. refresh_now is idempotent, so this is safe.
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(./logos/bin/logosctl --config-dir ./session call token_list_module refresh_now 2>&1)
            case "$out" in
              *RPC_FAILED*)
                ./logos/bin/logosctl --config-dir ./session module reload token_list_module >/dev/null 2>&1 || true
                ./logos/bin/logosctl --config-dir ./session call token_list_module configure @tl_config.json >/dev/null 2>&1 || true
                sleep 3 ;;
              *) break ;;
            esac
          done
          printf '%s\n' "$out"
        code_block: "logosctl call token_list_module refresh_now"
        expect_contains:
          - "tokenCount"
      - title: "Read merged tokens for chain 1"
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(./logos/bin/logosctl --config-dir ./session call token_list_module get_tokens 1 2>&1)
            case "$out" in *RPC_FAILED*) sleep 3 ;; *) break ;; esac
          done
          printf '%s\n' "$out"
        code_block: "logosctl call token_list_module get_tokens 1"
        expect_contains:
          - "USDC"
          - "USDT"
      - title: "Add a custom token"
        run: "./logos/bin/logosctl --config-dir ./session call token_list_module add_custom_token @custom_token.json"
        code_block: "logosctl call token_list_module add_custom_token @custom_token.json"
        expect_contains:
          - "true"
      - title: "The custom token now appears"
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(./logos/bin/logosctl --config-dir ./session call token_list_module get_tokens 1 2>&1)
            case "$out" in *RPC_FAILED*) sleep 3 ;; *) break ;; esac
          done
          printf '%s\n' "$out"
        expect_contains:
          - "MINE"
      - title: "Enable USDC from the catalogue"
        run: "./logos/bin/logosctl --config-dir ./session call token_list_module set_token_enabled 1 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48 true"
        code_block: "logosctl call token_list_module set_token_enabled 1 0xA0b8... true"
        expect_contains:
          - '\"enabled\":true'
          - '\"changed\":true'
      - title: "Read the offered ERC-20 set"
        run: "./logos/bin/logosctl --config-dir ./session call token_list_module list_offered 1"
        code_block: "logosctl call token_list_module list_offered 1"
        expect_contains:
          - "WETH"
          - "USDC"
          - '\"builtin\":true'
      - title: "Search the offered-first picker"
        run: "./logos/bin/logosctl --config-dir ./session call token_list_module list_available 1 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48 0 10"
        code_block: "logosctl call token_list_module list_available 1 0xA0b8... 0 10"
        expect_contains:
          - '\"total\":1'
          - "USDC"
          - '\"hasMore\":false'
      - title: "List the configured sources"
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(./logos/bin/logosctl --config-dir ./session call token_list_module get_list_sources 2>&1)
            case "$out" in *RPC_FAILED*) sleep 3 ;; *) break ;; esac
          done
          printf '%s\n' "$out"
        expect_contains:
          - "Test List"
      - title: "Fail-closed: refuse a fetch when a proxy is required"
        run: |
          ./logos/bin/logosctl --config-dir ./session call token_list_module configure @tl_config_fc.json
          ./logos/bin/logosctl --config-dir ./session call token_list_module refresh_now
        code_block: |
          logosctl call token_list_module configure @tl_config_fc.json
          logosctl call token_list_module refresh_now
        expect_contains:
          - "proxy required"
      - title: "Stop the daemon and the file server"
        run: |
          ./logos/bin/logosctl --config-dir ./session daemon stop || true
          kill "$(cat httpd.pid)" 2>/dev/null || true
        code_block: "logosctl daemon stop"
      - title: "Confirm the daemon has stopped"
        run: "./logos/bin/logosctl --config-dir ./session daemon status || true"
        code_block: "logosctl daemon status"
        expect_contains:
          - '"status":"not_running"'
